name: プレビュー用DBにマイグレーションを適用する

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  migrate-preview-db:
    environment: preview
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: pnpm インストール
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 依存関係インストール
        run: pnpm install

      - name: データベース初期化
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          echo "🔧 データベースの初期化を行います"

          # PostgreSQLクライアントをインストール
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          # publicスキーマの確認と作成
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS public;"
          psql "$DATABASE_URL" -c "GRANT ALL ON SCHEMA public TO public;"
          psql "$DATABASE_URL" -c "GRANT ALL ON SCHEMA public TO postgres;"

          # drizzleスキーマの確認と作成（マイグレーション管理テーブル用）
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS drizzle;"
          psql "$DATABASE_URL" -c "GRANT ALL ON SCHEMA drizzle TO public;"
          psql "$DATABASE_URL" -c "GRANT ALL ON SCHEMA drizzle TO postgres;"

          echo "✅ データベース初期化完了"

      - name: マイグレーション状態の確認と同期
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          echo "🔍 マイグレーション状態を確認します"

          # 既存のマイグレーションファイルをチェック
          if [ -d "./src/lib/db/migrations" ] && [ "$(ls -A ./src/lib/db/migrations)" ]; then
            echo "📁 既存のマイグレーションファイルが見つかりました"

            # 既存のマイグレーションを適用
            echo "🚀 既存マイグレーションを適用します"
            pnpm drizzle-kit migrate
            echo "✅ 既存マイグレーション適用完了"
          else
            echo "📝 マイグレーションファイルが存在しません"

            # スキーマの現在状態をベースラインとして設定
            echo "🔄 スキーマ同期を実行します"
            pnpm drizzle-kit push
            echo "✅ スキーマ同期完了"
          fi

      - name: 新しい変更の検出と適用
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          echo "🔧 新しいスキーマ変更をチェックします"

          # 新しいマイグレーションを生成（変更がある場合のみ）
          pnpm drizzle-kit generate

          # 生成されたマイグレーションファイルを確認
          if [ -n "$(find ./src/lib/db/migrations -name '*.sql' -newer ./src/lib/db/migrations/.timestamp 2>/dev/null || echo '')" ]; then
            echo "🆕 新しいマイグレーションが生成されました"

            # 新しいマイグレーションを適用
            pnpm drizzle-kit migrate
            echo "✅ 新しいマイグレーション適用完了"
          else
            echo "ℹ️ 適用する新しい変更はありません"
          fi

          # タイムスタンプファイルを更新
          mkdir -p ./src/lib/db/migrations
          touch ./src/lib/db/migrations/.timestamp
