name: プレビュー環境マイグレーション

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  migrate-preview:
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 依存関係インストール
        run: pnpm install

      - name: 環境検証
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL が設定されていません"
            exit 1
          fi

          if [[ ! "$DATABASE_URL" =~ ^postgres(ql)?:// ]]; then
            echo "❌ DATABASE_URL の形式が正しくありません"
            exit 1
          fi

          echo "✅ 環境変数検証完了"

      - name: マイグレーション実行
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          echo "🔧 マイグレーション処理を開始します"

          # マイグレーション生成
          pnpm drizzle-kit generate

          # マイグレーション適用（冪等性により安全）
          pnpm drizzle-kit migrate

          echo "✅ マイグレーション完了"
