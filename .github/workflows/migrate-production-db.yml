name: 本番環境DBにマイグレーションを適用する

on:
  push:
    branches:
      - main

jobs:
  migrate-production-db:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: pnpm インストール
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 依存関係インストール
        run: pnpm install

      - name: マイグレーションファイル生成
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "🔧 マイグレーションファイルを生成します"
          pnpm drizzle-kit generate
          echo "✅ マイグレーションファイル生成完了"

      - name: マイグレーション実行
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "🚀 本番環境DBへのマイグレーションを開始します"
          pnpm drizzle-kit migrate
          echo "✅ マイグレーションが完了しました"
