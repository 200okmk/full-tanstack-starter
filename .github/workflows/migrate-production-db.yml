name: 本番環境DBにマイグレーションを適用する

on:
  push:
    branches:
      - main

jobs:
  migrate-production-db:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: pnpm インストール
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 依存関係インストール
        run: pnpm install

      - name: データベース初期化
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "🔧 本番データベースの初期化を行います"

          # PostgreSQLクライアントをインストール
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          # publicスキーマの確認と作成
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS public;"
          psql "$DATABASE_URL" -c "GRANT ALL ON SCHEMA public TO public;"
          psql "$DATABASE_URL" -c "GRANT ALL ON SCHEMA public TO postgres;"

          # drizzleスキーマの確認と作成（マイグレーション管理テーブル用）
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS drizzle;"
          psql "$DATABASE_URL" -c "GRANT ALL ON SCHEMA drizzle TO public;"
          psql "$DATABASE_URL" -c "GRANT ALL ON SCHEMA drizzle TO postgres;"

          echo "✅ 本番データベース初期化完了"

      - name: マイグレーション状態の確認と同期
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "🔍 本番環境のマイグレーション状態を確認します"

          # 既存のマイグレーションファイルをチェック
          if [ -d "./src/lib/db/migrations" ] && [ "$(ls -A ./src/lib/db/migrations)" ]; then
            echo "📁 既存のマイグレーションファイルが見つかりました"

            # 本番環境では慎重に既存マイグレーションを適用
            echo "🚀 本番環境に既存マイグレーションを適用します"
            pnpm drizzle-kit migrate
            echo "✅ 既存マイグレーション適用完了"
          else
            echo "📝 マイグレーションファイルが存在しません"
            echo "⚠️ 本番環境では初回セットアップが必要です"

            # 本番環境では現在のスキーマ状態をベースラインとして記録
            echo "🔄 本番環境スキーマの同期を実行します"
            pnpm drizzle-kit push
            echo "✅ 本番環境スキーマ同期完了"
          fi

      - name: 新しい変更の検出と適用
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "🔧 本番環境への新しいスキーマ変更をチェックします"

          # 新しいマイグレーションを生成（変更がある場合のみ）
          pnpm drizzle-kit generate

          # 生成されたマイグレーションファイルを確認
          if [ -n "$(find ./src/lib/db/migrations -name '*.sql' -newer ./src/lib/db/migrations/.timestamp 2>/dev/null || echo '')" ]; then
            echo "🆕 本番環境に適用する新しいマイグレーションが生成されました"

            # 本番環境では特に慎重に新しいマイグレーションを適用
            echo "🚀 本番環境に新しいマイグレーションを適用します"
            pnpm drizzle-kit migrate
            echo "✅ 本番環境新しいマイグレーション適用完了"
          else
            echo "ℹ️ 本番環境に適用する新しい変更はありません"
          fi

          # タイムスタンプファイルを更新
          mkdir -p ./src/lib/db/migrations
          touch ./src/lib/db/migrations/.timestamp
