[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # このnetlify.tomlはGit管理するため、シークレットはダッシュボードから登録する

# Production context
# 本番環境
[context.production.environment]
  NODE_ENV = "production"
  # Netlifyリモート環境用設定：Netlifyはビルド時に各環境ごとの動的なベースURLを$URLという変数に自動で格納するため、ダッシュボードから環境変数VITE_BASE_URLを作成し、値を${URL}にする
  BASE_URL = "${URL}"
  VITE_BASE_URL = "${URL}"

# Deploy Preview context
# 毎PR作成時にビルドされる一時的なプレビュー環境
[context.deploy-preview.environment]
  NODE_ENV = "production"
  BASE_URL = "${DEPLOY_PRIME_URL}"
  VITE_BASE_URL = "${DEPLOY_PRIME_URL}"

# Branch Deploy context
# main以外のブランチにpushしたときに自動でデプロイされるプレビュー環境
[context.branch-deploy.environment]
  NODE_ENV = "production"
  BASE_URL = "${DEPLOY_PRIME_URL}"
  VITE_BASE_URL = "${DEPLOY_PRIME_URL}"

# Development context
# ローカル開発環境（netlify dev使用時）
[context.dev.environment]
  NODE_ENV = "development"
  BASE_URL = "http://localhost:3000"
  VITE_BASE_URL = "http://localhost:3000"
