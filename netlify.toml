[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlifyリモート環境はビルド時に各環境ごとの動的なベースURLを"URL"変数に格納してくれる。アプリコードから統一的にVITE_BASE_URLという変数名でそれにアクセスする。
  VITE_BASE_URL = "$URL"
  # このnetlify.tomlはGit管理するため、シークレットはダッシュボードから登録する！

# Production context
# 本番環境
[context.production.environment]
  NODE_ENV = "production"

# Deploy Preview context
# 毎PR作成時にビルドされる一時的なプレビュー環境
[context.deploy-preview.environment]
  NODE_ENV = "production"

# Branch Deploy context
# main以外のブランチにpushしたときに自動でデプロイされるプレビュー環境
[context.branch-deploy.environment]
  NODE_ENV = "production"
